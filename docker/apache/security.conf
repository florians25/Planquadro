# Planquadro – Apache-Härtung (Server-weit; ersetzt conf-enabled/security.conf der Distribution)
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
Timeout 120
KeepAliveTimeout 5
LimitRequestBody 52428800

# Reverse Proxy: Die Anwendung wertet X-Forwarded-For nur für die in
# PQ_TRUSTED_PROXIES genannten Adressen aus (app/lib/Security.php).
# HTTPS hinter dem Proxy: der Entrypoint erzeugt zz-planquadro-runtime.conf,
# die HTTPS=on nur für Anfragen dieser Proxys mit X-Forwarded-Proto: https setzt.
