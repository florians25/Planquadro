# OpsPilot – Apache-VirtualHost im Container
# Läuft ohne Root-Rechte auf Port 8080. TLS terminiert ein Reverse Proxy
# (Caddy-Profil in docker-compose.yml, eigenes nginx/Traefik).
Listen ${APACHE_LISTEN_PORT}

<VirtualHost *:${APACHE_LISTEN_PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Alles außerhalb von public/ (app/, bin/, migrations/, docker/ …) ist
    # nicht erreichbar; public/.htaccess regelt Rewrites und Header.
    <Directory /var/www/html>
        Options None
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    # Logs nach stdout/stderr (docker logs); Health-Checks nicht protokollieren
    SetEnvIf Request_URI "^/api/(healthz|readyz)$" opspilot_health
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!opspilot_health
</VirtualHost>
