# Planquadro – Beispiel-Override für den SaaS-Betrieb (viele Mandanten)
# ---------------------------------------------------------------------------
#   docker compose -f docker-compose.yml -f docker-compose.saas.yml --profile proxy up -d
#   docker compose exec app php bin/tenant.php create acme "Acme GmbH" --domain=acme.example.de
#
# - Plattform-Datenbank planquadro_platform (Mandanten, Domains, backup_runs)
# - je Mandant eine Datenbank planquadro_t_<slug> (Rechte: docker/db-init/)
# - Mandant wird über den Hostnamen aufgelöst (tenant_domains); die API v1 ist
#   zusätzlich über PQ_PLATFORM_HOST mit Header X-PQ-Tenant erreichbar
# - der Backup-Dienst sichert jeden Mandanten und die Plattform-DB einzeln
# - Caddy: alle Mandanten-Hosts und den Plattform-Host in PQ_DOMAIN
#   aufführen (kommagetrennt); für sehr viele Mandanten On-Demand-TLS oder ein
#   Wildcard-Zertifikat per DNS-Challenge verwenden (docs/INSTALLATION.md)
#
# Mehrere App-Container: zusätzlich docker-compose.replicas.yml laden
# (PQ_SESSION_STORE=db – Sitzungen in der jeweiligen Mandanten-DB, siehe
# docs/INSTALLATION.md, „Mehrere App-Container“).

services:
  app:
    environment: &saas-env
      PQ_MODE: saas
      PQ_PLATFORM_DB_NAME: ${PQ_PLATFORM_DB_NAME:-planquadro_platform}
      PQ_PLATFORM_HOST: ${PQ_PLATFORM_HOST:-api.example.de}
      PQ_TENANT_DB_PREFIX: ${PQ_TENANT_DB_PREFIX:-planquadro_t_}
      PQ_DB_NAME: ${PQ_PLATFORM_DB_NAME:-planquadro_platform}

  backup:
    environment: *saas-env

  db:
    environment:
      MARIADB_DATABASE: ${PQ_PLATFORM_DB_NAME:-planquadro_platform}
