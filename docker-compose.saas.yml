# Vireo – Beispiel-Override für den SaaS-Betrieb (viele Mandanten)
# ---------------------------------------------------------------------------
#   docker compose -f docker-compose.yml -f docker-compose.saas.yml --profile proxy up -d
#   docker compose exec app php bin/tenant.php create acme "Acme GmbH" --domain=acme.example.de
#
# - Plattform-Datenbank vireo_platform (Mandanten, Domains, backup_runs)
# - je Mandant eine Datenbank vireo_t_<slug> (Rechte: docker/db-init/)
# - Mandant wird über den Hostnamen aufgelöst (tenant_domains); die API v1 ist
#   zusätzlich über VIREO_PLATFORM_HOST mit Header X-Vireo-Tenant erreichbar
# - der Backup-Dienst sichert jeden Mandanten und die Plattform-DB einzeln
# - Caddy: alle Mandanten-Hosts und den Plattform-Host in VIREO_DOMAIN
#   aufführen (kommagetrennt); für sehr viele Mandanten On-Demand-TLS oder ein
#   Wildcard-Zertifikat per DNS-Challenge verwenden (docs/INSTALLATION.md)
#
# Hinweis: Für horizontale Skalierung mehrerer App-Container werden gemeinsame
# Sessions benötigt (Phase 3/4-Folgearbeit, ARCHITECTURE.md B.7). Dieses Beispiel
# betreibt einen App-Container.

services:
  app:
    environment: &saas-env
      VIREO_MODE: saas
      VIREO_PLATFORM_DB_NAME: ${VIREO_PLATFORM_DB_NAME:-vireo_platform}
      VIREO_PLATFORM_HOST: ${VIREO_PLATFORM_HOST:-api.example.de}
      VIREO_TENANT_DB_PREFIX: ${VIREO_TENANT_DB_PREFIX:-vireo_t_}
      VIREO_DB_NAME: ${VIREO_PLATFORM_DB_NAME:-vireo_platform}

  backup:
    environment: *saas-env

  db:
    environment:
      MARIADB_DATABASE: ${VIREO_PLATFORM_DB_NAME:-vireo_platform}
