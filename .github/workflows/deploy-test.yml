name: Deploy-Test

# Baut das Docker-Image, startet den Compose-Stack und prüft Installation,
# Login, Backup, Restore-Test und Restore (tests/deploy/compose-smoke.sh).
# Veröffentlicht nichts.

on:
  push:
    branches: ["**"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "docker-compose*.yml"
      - "app/**"
      - "bin/**"
      - "public/**"
      - "migrations/**"
      - "database.sql"
      - "tests/deploy/**"
      - ".github/workflows/deploy-test.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker-Image + Compose (Self-Hosting)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VIREO_IMAGE: vireo/app:ci
      VIREO_HTTP_PORT: "8080"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: vireo/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image prüfen (nicht root, Erweiterungen, keine Testdateien)
        run: |
          test "$(docker run --rm --entrypoint id vireo/app:ci -u)" = "33"
          docker run --rm --entrypoint php vireo/app:ci -m | grep -iE '^(pdo_mysql|intl|calendar|zip|sodium|pcntl|Zend OPcache)$' | sort | uniq | wc -l | grep -q 7
          docker run --rm --entrypoint sh vireo/app:ci -c 'test ! -e tests && test ! -e vendor && test ! -e .git && command -v mariadb-dump && command -v rclone'

      - name: CI-Konfiguration und Secrets erzeugen
        run: |
          cat > .env <<'EOF'
          VIREO_IMAGE=vireo/app:ci
          VIREO_HTTP_BIND=127.0.0.1
          VIREO_HTTP_PORT=8080
          VIREO_FORCE_SECURE_COOKIES=0
          VIREO_DOMAIN=localhost
          VIREO_SCHEDULER_INTERVAL=15
          VIREO_BACKUP_BANNER=1
          EOF
          sh docker/init-secrets.sh

      - name: Deploymenttest
        run: sh tests/deploy/compose-smoke.sh

      - name: Caddy-Profil (HTTPS, Proxy-Vertrauen)
        run: |
          KEEP=1 sh tests/deploy/compose-smoke.sh > /dev/null
          docker compose --profile proxy up -d --no-build
          for i in $(seq 1 30); do curl -skf -o /dev/null https://localhost/api/readyz && break; sleep 2; done
          curl -skI https://localhost/ | tee /tmp/h.txt
          grep -qi '^set-cookie:.*secure' /tmp/h.txt
          grep -qi '^strict-transport-security' /tmp/h.txt
          # direkter Zugriff mit gefälschtem Header darf kein Secure-Cookie erzeugen
          ! curl -sI -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/ | grep -qi '^set-cookie:.*secure'

      - name: Logs bei Fehlern
        if: failure()
        run: docker compose --profile proxy logs --tail 200 || true

      - name: Abbau
        if: always()
        run: |
          docker compose --profile proxy down -v --remove-orphans || true
          rm -rf secrets .env
