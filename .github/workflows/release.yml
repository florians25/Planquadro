name: Release-Image

# Baut ein Multi-Arch-Image (amd64, arm64) und veröffentlicht es in der
# GitHub Container Registry – AUSSCHLIESSLICH bei einem gepushten Tag v*
# oder bei manuellem Start (workflow_dispatch). Branch-Pushes veröffentlichen nie.
# Das Image wird mit cosign (keyless, Sigstore) signiert; SBOM und Provenienz
# werden als Attestierungen angehängt.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image-Tag (z. B. v1.2.3); leer = Git-Referenz"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name (Kleinbuchstaben)
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=tag

      - name: Bauen und veröffentlichen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PQ_VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Signieren (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # Android-Testbuild (debug-signiert, zum Ausprobieren – nicht für den Play Store)
  android-apk:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Web-Build und Android-Sync
        run: npm ci --no-audit --no-fund && npm run build && npx cap sync android
      - name: APK bauen
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: APK benennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "../planquadro-${GITHUB_REF_NAME}-android-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: planquadro-*-android-test.apk

  # Web-App (PWA-Build der Mobile-App) als ZIP
  web-app:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bauen
        working-directory: mobile
        run: npm ci --no-audit --no-fund && npm run build
      - name: Packen
        run: cd mobile/dist && zip -qr "../../planquadro-${GITHUB_REF_NAME}-web-app.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: planquadro-*-web-app.zip

  # GitHub-Release mit Release-Notes (docs/releases/<tag>.md) und den Builds
  github-release:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [image, android-apk, web-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
        continue-on-error: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || notes="CHANGELOG.md"
          files=$(ls dist/* 2>/dev/null || true)
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ -n "$files" ] && gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" --title "Planquadro ${TAG#v}" --notes-file "$notes" --verify-tag $files
          fi
