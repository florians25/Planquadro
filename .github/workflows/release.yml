name: Release-Image

# Baut ein Multi-Arch-Image (amd64, arm64) und veröffentlicht es in der
# GitHub Container Registry – AUSSCHLIESSLICH bei einem gepushten Tag v*
# oder bei manuellem Start (workflow_dispatch). Branch-Pushes veröffentlichen nie.
# Manueller Start mit „tag“ (z. B. v7.0.0): legt den Tag auf dem gewählten Commit an
# (annotiert, Tagger florians25) und erstellt daraus das komplette Release – für
# Umgebungen, in denen Tags nicht direkt gepusht werden können.
# Das Image wird mit cosign (keyless, Sigstore) signiert; SBOM und Provenienz
# werden als Attestierungen angehängt.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, der angelegt wird (z. B. v7.0.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Nur bei manuellem Start: Tag anlegen (bei Tag-Push existiert er bereits)
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag anlegen
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Ungültiger Tag: $RELEASE_TAG"; exit 1;; esac
          test -f "docs/releases/${RELEASE_TAG}.md" || { echo "docs/releases/${RELEASE_TAG}.md fehlt"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Tag ${RELEASE_TAG} existiert bereits – wird verwendet."
          else
            git config user.name "florians25"
            git config user.email "111896304+florians25@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Planquadro ${RELEASE_TAG#v}" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

  image:
    needs: [tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Image-Name (Kleinbuchstaben)
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_TAG }}

      - name: Bauen und veröffentlichen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PQ_VERSION=${{ env.RELEASE_TAG }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Signieren (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # Native Apps: Android-Testbuild (debug-signiert, nicht für den Play Store), iOS-Simulator-Build,
  # Emulator-Screenshots → Branch app-screenshots. Ein Workflow für Push/Tag/manuell (apps.yml),
  # hier als wiederverwendbarer Workflow, damit die Artefakte in diesem Lauf am Release hängen.
  apps:
    needs: [tag]
    uses: ./.github/workflows/apps.yml
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write

  # Web-App (PWA-Build der Mobile-App) als ZIP
  web-app:
    needs: [tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bauen
        working-directory: mobile
        run: npm ci --no-audit --no-fund && npm run build
      - name: Packen
        run: cd mobile/dist && zip -qr "../../planquadro-${RELEASE_TAG}-web-app.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: planquadro-*-web-app.zip

  # GitHub-Release mit Release-Notes (docs/releases/<tag>.md) und den Builds
  github-release:
    if: always() && needs.tag.result == 'success'
    needs: [tag, image, apps, web-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      # Nur die Builds anhängen (nicht die Screenshot-Artefakte)
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: dist
        continue-on-error: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || notes="CHANGELOG.md"
          files=$(ls dist/* 2>/dev/null || true)
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ -n "$files" ] && gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" --title "Planquadro ${TAG#v}" --notes-file "$notes" --verify-tag $files
          fi
