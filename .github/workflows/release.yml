name: Release-Image

# Baut ein Multi-Arch-Image (amd64, arm64) und veröffentlicht es in der
# GitHub Container Registry – AUSSCHLIESSLICH bei einem gepushten Tag v*
# oder bei manuellem Start (workflow_dispatch). Branch-Pushes veröffentlichen nie.
# Das Image wird mit cosign (keyless, Sigstore) signiert; SBOM und Provenienz
# werden als Attestierungen angehängt.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image-Tag (z. B. v1.2.3); leer = Git-Referenz"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name (Kleinbuchstaben)
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=tag

      - name: Bauen und veröffentlichen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VIREO_VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Signieren (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.name.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
