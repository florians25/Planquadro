title = "Planquadro gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Testdaten mit Dummy-Zugangsdaten (keine echten Geheimnisse)"
paths = [
  '''^tests/''',
  '''^mobile/tests/''',
  '''^mobile/src/api/fixtures/''',
  '''composer\.lock''',
  '''package-lock\.json''',
]
# Bezeichner, keine Geheimnisse: Speicherschlüssel der App-Einstellungen
regexes = [
  '''planquadro\.prefs\.v1''',
]
