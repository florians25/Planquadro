# Planquadro – native Apple-App (iPhone, iPad)
# Projekt erzeugen:  brew install xcodegen && cd apple && xcodegen
# Das erzeugte Planquadro.xcodeproj wird nicht eingecheckt (siehe .gitignore).
name: Planquadro

options:
  bundleIdPrefix: de.planquadro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "7.0.5"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: NO

packages:
  PlanquadroKit:
    path: PlanquadroKit

targets:
  Planquadro:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: PlanquadroKit
      - target: PlanquadroWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Planquadro
        PRODUCT_BUNDLE_IDENTIFIER: $(PQ_BUNDLE_ID)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Planquadro.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(PQ_EXTRA_CONDITIONS)"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(PQ_EXTRA_CONDITIONS)"

  PlanquadroWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: PlanquadroKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_NAME: PlanquadroWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(PQ_BUNDLE_ID).widgets
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PlanquadroWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG WIDGET_EXTENSION $(PQ_EXTRA_CONDITIONS)"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "WIDGET_EXTENSION $(PQ_EXTRA_CONDITIONS)"

  PlanquadroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: Planquadro
      - package: PlanquadroKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PQ_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Planquadro.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Planquadro
        BUNDLE_LOADER: $(TEST_HOST)

  PlanquadroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Planquadro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PQ_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Planquadro

schemes:
  Planquadro:
    build:
      targets:
        Planquadro: all
        PlanquadroWidgets: all
        PlanquadroTests: [test]
        PlanquadroUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-PQDemo YES": false
        "-PQScreen plan": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: PlanquadroTests
        - name: PlanquadroUITests
          skipped: false
    archive:
      config: Release
  PlanquadroUnitTests:
    build:
      targets:
        Planquadro: all
        PlanquadroTests: [test]
    test:
      config: Debug
      targets:
        - name: PlanquadroTests
